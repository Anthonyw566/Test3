name: Build & Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Core logic tests
        run: ./gradlew :core:test --console=plain 2>&1 | tee core.log; exit ${PIPESTATUS[0]}

      - name: Compile mod
        run: ./gradlew compileJava --console=plain 2>&1 | tee compile.log; exit ${PIPESTATUS[0]}

      - name: Build jar
        run: ./gradlew build -x :core:test --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: In-game tests (headless GameTest server)
        run: ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log; exit ${PIPESTATUS[0]}

      - name: Upload jar and resource pack
        uses: actions/upload-artifact@v4
        with:
          name: distantfrontiers
          path: |
            build/libs/distantfrontiers-*.jar
            build/pack/distantfrontiers-pack.zip

      - name: Publish "latest" pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest build/libs/distantfrontiers-*.jar build/pack/distantfrontiers-pack.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Distant Frontiers - latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Passed the core logic tests and the in-game GameTests. Server-side only: drop the jar into your ATM10 server's mods/ folder. The resource pack is offered to players automatically - you don't need to download it."

      # Short, greppable summary at the very end of the log.
      - name: Report
        if: always()
        run: |
          echo "=================== CORE TESTS ==================="
          grep -E "tests completed|FAILED|BUILD (SUCCESSFUL|FAILED)" core.log 2>/dev/null | head -40 || true
          echo "=================== COMPILE ==================="
          grep -E "error:|BUILD (SUCCESSFUL|FAILED)" -A4 compile.log 2>/dev/null | head -200 || true
          echo "=================== GAMETESTS ==================="
          grep -iE "LogTestReporter|failed at|tests? (passed|failed)|required test|exception|caused by|error|BUILD (SUCCESSFUL|FAILED)" gametest.log 2>/dev/null \
            | grep -v "DEBUG" | head -200 || true
          echo "=================== END ==================="
