name: Build & Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Core logic tests
        run: ./gradlew :core:test --console=plain

      - name: Compile mod
        run: ./gradlew compileJava --console=plain

      - name: Build jar
        run: ./gradlew build -x :core:test --console=plain

      - name: In-game tests (headless GameTest server)
        run: ./gradlew runGameTestServer --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: distantfrontiers-jar
          path: build/libs/distantfrontiers-*.jar

      - name: Publish "latest" pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest build/libs/distantfrontiers-*.jar \
            --prerelease --target "$GITHUB_SHA" \
            --title "Distant Frontiers — latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Passed core tests and in-game tests. Drop the jar into your ATM10 server's mods/ folder (server only)."
