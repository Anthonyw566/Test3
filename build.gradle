plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = 'dev.anthonyw.distantfrontiers'

base {
    archivesName = 'distantfrontiers'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The mod compiles the pure-logic core sources directly into its own jar.
// The :core subproject compiles and unit-tests the same sources without
// Minecraft, so `./gradlew :core:test` works anywhere.
sourceSets.main.java.srcDir 'core/src/main/java'

// ---------------------------------------------------------------------------
// Resource pack (custom sounds, icons, title animations). The zip is built
// reproducibly - same assets, same bytes, same SHA-1 - and its URL + SHA-1 are
// baked into the jar so the server can offer it to players on join.
def packZip = tasks.register('resourcePackZip', Zip) {
    from 'resourcepack'
    archiveFileName = 'distantfrontiers-pack.zip'
    destinationDirectory = layout.buildDirectory.dir('pack')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirPermissions { unix('rwxr-xr-x') }
    filePermissions { unix('rw-r--r--') }
}

def packInfoDir = layout.buildDirectory.dir('generated/packinfo')
def packInfo = tasks.register('resourcePackInfo') {
    dependsOn packZip
    def zipFile = packZip.flatMap { it.archiveFile }
    def url = project.pack_url
    inputs.file(zipFile)
    inputs.property('url', url)
    outputs.dir(packInfoDir)
    doLast {
        def bytes = zipFile.get().asFile.bytes
        def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(bytes).encodeHex().toString()
        def out = packInfoDir.get().file('distantfrontiers-pack.properties').asFile
        out.parentFile.mkdirs()
        out.text = "url=${url}\nsha1=${sha1}\n"
        logger.lifecycle("Resource pack: ${bytes.length} bytes, sha1 ${sha1}")
    }
}
sourceSets.main.resources.srcDir(packInfo)

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
        }
        client {
            client()
        }
        // Headless server that runs every @GameTest in the mod, then exits
        // with a non-zero code if any failed. Used by CI.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'distantfrontiers'
        }
    }

    mods {
        distantfrontiers {
            sourceSet sourceSets.main
        }
    }
}
