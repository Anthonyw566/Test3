plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = 'dev.anthonyw.distantfrontiers'

base {
    archivesName = 'distantfrontiers'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The mod compiles the pure-logic core sources directly into its own jar.
// The :core subproject compiles and TESTS the same sources without Minecraft,
// so `gradle :core:test` works even where the NeoForge toolchain can't download.
sourceSets.main.java.srcDir 'core/src/main/java'

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
        }
        client {
            client()
        }
    }

    mods {
        distantfrontiers {
            sourceSet sourceSets.main
        }
    }
}
